<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria SEO</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12141c;--ink-soft:#4a4f5e;--paper:#faf9f6;--rule:#e2e0d9;
  --brand:#f97316;--bing:#0d7a6f;--unverified:#9a9689;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Public Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:840px;margin:0 auto;padding:0 24px 60px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,42px);
  letter-spacing:-.025em;line-height:1.05;margin:0 0 10px}
h2{font-family:var(--display);font-weight:600;font-size:clamp(20px,3vw,26px);
  letter-spacing:-.02em;margin:0 0 14px}
h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 4px}
p{margin:0 0 14px;max-width:66ch}
.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.14em;color:var(--brand);margin:34px 0 12px}

/* aviso de coleta — sempre visível, nunca rodapé */
.disclaimer{border:1px solid var(--rule);border-left:3px solid var(--brand);
  background:#fff;border-radius:3px;padding:14px 18px;margin:0 0 30px;
  font-size:14px;color:var(--ink-soft)}
.disclaimer strong{color:var(--ink)}
.disclaimer .meta{font-family:var(--mono);font-size:12px;margin-top:8px;
  padding-top:8px;border-top:1px dashed var(--rule)}

/* boletim */
.card{border:1px solid var(--rule);background:#fff;border-radius:3px;overflow:hidden}
.rows{padding:6px 0}
.row{display:grid;grid-template-columns:1fr 92px 92px;align-items:center;
  gap:10px;padding:9px 20px}
.row.head{padding-top:14px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.row.head span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);text-align:center}
.row.head span:first-child{text-align:left}
.row.head .gh{color:var(--brand)}.row.head .bh{color:var(--bing)}
.row-label{font-size:15px}
.bar{position:relative;height:22px;background:#f1efe9;border-radius:2px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block;height:100%}
.bar b{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;font-weight:600}
.g i{background:rgba(249,115,22,.28)}.b i{background:rgba(13,122,111,.22)}
.na{font-family:var(--mono);font-size:10.5px;color:var(--unverified);
  text-align:center;border:1px dashed var(--rule);border-radius:2px;padding:4px 0}
.row.total{border-top:1px solid var(--rule);margin-top:6px;padding:14px 20px;font-weight:600}
.row.total .score{font-family:var(--display);font-weight:800;font-size:26px;
  text-align:center;letter-spacing:-.02em}
.row.total .gs{color:var(--brand)}.row.total .bs{color:var(--bing)}
.card-foot{border-top:1px solid var(--rule);background:#fcfbf8;padding:12px 20px;
  font-size:13px;color:var(--ink-soft)}
.overall{display:flex;align-items:baseline;gap:12px;margin:22px 0 0}
.overall b{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-.03em}
.overall span{font-size:14px;color:var(--ink-soft)}

/* prioridades */
ol.fixes{list-style:none;counter-reset:f;padding:0;margin:0}
ol.fixes li{counter-increment:f;display:grid;grid-template-columns:34px 1fr;
  gap:14px;padding:16px 0;border-bottom:1px solid var(--rule)}
ol.fixes li::before{content:counter(f);font-family:var(--mono);font-size:13px;
  font-weight:600;color:var(--brand);padding-top:2px}
.impact{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.08em;border:1px solid var(--rule);border-radius:2px;
  padding:2px 7px;margin-left:8px;color:var(--ink-soft);white-space:nowrap}
ol.fixes p{font-size:14.5px;color:var(--ink-soft);margin:4px 0 0}

/* detalhes */
.detail{border:1px solid var(--rule);background:#fff;border-radius:3px;
  padding:16px 18px;margin-bottom:12px}
.detail .ev{font-size:14.5px;color:var(--ink-soft);margin:6px 0 0}
.detail .fix{font-size:14.5px;margin:10px 0 0;padding-top:10px;
  border-top:1px dashed var(--rule)}
.detail .fix strong{font-family:var(--mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--brand);display:block;margin-bottom:3px}

/* não verificado — destaque deliberado */
.unver{border:1px dashed var(--unverified);border-radius:3px;padding:18px 20px;background:none}
.unver ul{margin:8px 0 0;padding-left:18px;color:var(--ink-soft);font-size:14.5px}
.unver li{margin-bottom:5px}

footer{border-top:1px solid var(--rule);margin-top:40px;padding-top:18px;
  font-size:13px;color:var(--ink-soft)}
footer a{color:var(--ink-soft)}
@media (max-width:560px){
  .row{grid-template-columns:1fr 74px 74px;padding-left:14px;padding-right:14px}
  .row-label{font-size:13.5px}
}
@media print{
  body{background:#fff}
  .card,.detail,.disclaimer{break-inside:avoid}
  .wrap{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="report"></div>
  <footer>
    Gerado pela skill <strong>SEO Rank Audit</strong> —
    <a href="https://www.cupomdescontos.com/ferramentas/auditoria-seo">documentação e código</a>.
    As notas refletem fatores de ranqueamento documentados por Google e Bing, não o algoritmo real.
  </footer>
</div>

<script>
/*__DATA_START__*/
const DATA = {
  "site": "exemplo.com.br",
  "generated_at": "2026-07-24",
  "sample_size": 8,
  "collection_note": null,
  "engines": {
    "google": {"total": 73, "categories": [
      {"name": "Conteúdo e E-E-A-T", "score": 19, "max": 25},
      {"name": "Backlinks", "verified": false}
    ]},
    "bing": {"total": 78, "categories": [
      {"name": "Conteúdo e E-E-A-T", "score": 20, "max": 25},
      {"name": "Backlinks", "verified": false}
    ]}
  },
  "overall": 76,
  "renormalized_note": "",
  "divergences": "",
  "strengths": "",
  "priorities": [],
  "details": [],
  "unverified": []
};
/*__DATA_END__*/

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function catRows(d){
  // une as categorias das duas rubricas preservando a ordem de aparição
  const order = [];
  const map = {};
  for (const eng of ["google","bing"]) {
    for (const c of (d.engines[eng]?.categories || [])) {
      if (!(c.name in map)) { map[c.name] = {}; order.push(c.name); }
      map[c.name][eng] = c;
    }
  }
  return order.map(name => {
    const cell = (eng, cls) => {
      const c = map[name][eng];
      if (!c) return `<span class="na">—</span>`;
      if (c.verified === false) return `<span class="na">não verificado</span>`;
      const pct = c.max ? Math.round((c.score / c.max) * 100) : 0;
      return `<span class="bar ${cls}"><i style="width:${pct}%"></i><b>${esc(c.score)}/${esc(c.max)}</b></span>`;
    };
    return `<div class="row"><span class="row-label">${esc(name)}</span>${cell("google","g")}${cell("bing","b")}</div>`;
  }).join("");
}

function render(d){
  const note = d.collection_note
    ? `<p><strong>Coleta parcial.</strong> ${esc(d.collection_note)}</p>` : "";
  const renorm = d.renormalized_note
    ? `<p>${esc(d.renormalized_note)}</p>` : "";

  const sections = [];

  sections.push(`
    <h1>Auditoria SEO — ${esc(d.site)}</h1>
    <div class="disclaimer">
      ${note}${renorm}
      <p style="margin:0">As notas medem <strong>fatores documentados</strong> por Google e Bing.
      Não são previsão de posição no ranking, e itens não verificados ficam fora da base de cálculo
      em vez de virar zero.</p>
      <p class="meta">${esc(d.generated_at)} · amostra: ${esc(d.sample_size)} página(s)</p>
    </div>`);

  sections.push(`
    <div class="card">
      <div class="rows">
        <div class="row head"><span>Critério</span><span class="gh">Google</span><span class="bh">Bing</span></div>
        ${catRows(d)}
        <div class="row total">
          <span class="row-label">Nota final</span>
          <span class="score gs">${esc(d.engines.google?.total ?? "—")}</span>
          <span class="score bs">${esc(d.engines.bing?.total ?? "—")}</span>
        </div>
      </div>
      <p class="card-foot">Rubricas diferentes de propósito: o Bing pesa mais correspondência
      literal de palavra-chave, frescor e IndexNow; o Google, profundidade, autoria e confiança.</p>
    </div>
    <div class="overall"><b>${esc(d.overall)}</b><span>nota geral, de 0 a 100</span></div>`);

  if (d.divergences) sections.push(
    `<p class="eyebrow">Google × Bing</p><h2>Onde os dois discordam</h2><p>${esc(d.divergences)}</p>`);

  if (d.priorities?.length) sections.push(`
    <p class="eyebrow">Ordem de ataque</p><h2>Correções por impacto</h2>
    <ol class="fixes">${d.priorities.map(p => `
      <li><div><h3>${esc(p.title)}<span class="impact">${esc(p.impact || "—")}</span></h3>
      <p>${esc(p.detail)}</p></div></li>`).join("")}</ol>`);

  if (d.details?.length) sections.push(`
    <p class="eyebrow">Evidências</p><h2>Detalhe por categoria</h2>
    ${d.details.map(x => `<div class="detail">
      <h3>${esc(x.category)}</h3>
      <p class="ev">${esc(x.evidence)}</p>
      ${x.fix ? `<p class="fix"><strong>Correção</strong>${esc(x.fix)}</p>` : ""}
    </div>`).join("")}`);

  if (d.strengths) sections.push(
    `<p class="eyebrow">O que já está certo</p><h2>Pontos fortes</h2><p>${esc(d.strengths)}</p>`);

  if (d.unverified?.length) sections.push(`
    <p class="eyebrow">Fora do alcance desta auditoria</p><h2>Não verificado</h2>
    <div class="unver"><p style="margin:0">Estes itens não foram medidos e não entraram na nota.
    Para fechá-los:</p><ul>${d.unverified.map(u => `<li>${esc(u)}</li>`).join("")}</ul></div>`);

  document.getElementById("report").innerHTML = sections.join("");
  document.title = `Auditoria SEO — ${d.site}`;
}
render(DATA);
</script>
</body>
</html>
